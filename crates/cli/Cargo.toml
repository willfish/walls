[package]
name = "walls"
description = "Wallpaper manager CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "walls"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:ratatui"]
tui-preview = ["tui", "dep:image", "dep:ratatui-image"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
ratatui = { version = "0.30", features = ["crossterm"], optional = true }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"], optional = true }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walls-core = { path = "../core" }

[dev-dependencies]
assert_cmd = "2"
portable-pty = "0.9"
predicates = "3"
serde_json.workspace = true
tempfile = "3"
